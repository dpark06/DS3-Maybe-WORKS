<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your pick · Not Only for Bodega Cats</title>
  <meta name="theme-color" content="#0B4AFF" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B4AFF'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='white' stroke-width='7'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet" />

<body class="sharepage" data-page="share">
<!--include:nav-->
  <main class="sharepage__main" id="main">
    <p class="eyebrow">Not only for bodega cats</p>
    <h1 class="h2" id="share-title">Here's your pick!</h1>
    <canvas id="share-canvas" class="share__preview share__preview--big" width="1080" height="1350" aria-label="Your photo with your symbol"></canvas>
    <p class="status" id="share-status" role="status" aria-live="polite"></p>
    <div class="share__buttons share__buttons--row">
      <button class="btn btn--solid" id="btn-download">Download</button>
      <button class="btn" id="btn-share" hidden>Share</button>
    </div>
    <a class="linklike" href="/#collection">Pick another photo</a>
  </main>
<!--include:footer-->
  <script type="module" src="/src/share.js"></script>
</body>
</html>
